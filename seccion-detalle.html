<!doctype html>
<html lang="es" data-tema="claro" data-idioma="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de seccion | Inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/global.css?v=baja-modal-cancel-2" />
</head>
  <body data-section="inventario" data-requires-auth="true">
    <div id="cabecera-superior"></div>
    <main>
      <div id="cabecera-de-pagina"></div>
      <div id="mensaje-seccion"></div>
      <div id="lista-de-equipos" class="list regla-diseno-037"></div>
      <div id="contenedor-modal"></div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/componentes.js?v=baja-modal-cancel-2"></script>
    <script src="js/traducciones.js"></script>
    <script src="js/core/ui.js?v=modular-1"></script>
    <script src="js/core/api.js?v=modular-1"></script>
    <script src="js/core/portal.js?v=modular-1"></script>
    <script src="js/modules/inventario.js?v=modular-1"></script>
    <script src="js/modules/usuarios.js?v=modular-1"></script>
    <script src="js/modules/tareas-planilla.js?v=modular-1"></script>
    <script src="js/modules/operaciones.js?v=modular-1"></script>
    <script src="js/core/sesion.js?v=modular-1"></script>
    <script src="js/app.js?v=modular-1"></script>
    <script>
      
      if (protegerRuta()) {
        (async function () {
        let idSeccion = obtenerParametroDeUrl('id');
        let seccionActual = await obtenerSeccionInventarioPorId(idSeccion);
        const seccionesInventario = await obtenerSeccionesInventario();
        let equipoTrasladoSeleccionado = null;
        if (!seccionActual && seccionesInventario.length > 0) {
          seccionActual = seccionesInventario[0];
          idSeccion = seccionActual.id;
        }
        function mostrarMensajeSeccion(texto, tipo) {
          mostrarMensajeFormulario('mensaje-seccion', texto, tipo);
        }
        function opcionesTiposEquipo() {
          return crearOpcionesSelect(
            tiposDeEquipoInventario,
            '<option value="" data-clave="elegir_tipo">Elegir tipo</option>',
            function (tipo) {
              return tipo.valor;
            },
            function (tipo) {
              return tipo.etiqueta;
            },
          );
        }
        async function renderCabecera() {
          if (!seccionActual) {
            mostrarEn(
              'cabecera-superior',
              crearCabeceraCompleta([
                { etiqueta: 'Home', enlace: 'home.html' },
                { etiqueta: 'Inventario', enlace: 'inventario.html' },
                { etiqueta: 'Secciones', enlace: 'secciones.html' },
                { etiqueta: 'Sin secciones' },
              ]),
            );
            mostrarEn(
              'cabecera-de-pagina',
              crearCabeceraDePagina({
                titulo: 'Sin secciones',
                volverA: 'secciones.html',
              }),
            );
            return;
          }
          const equiposDeLaSeccion = await obtenerEquiposPorSeccionInventario(seccionActual.id);
          mostrarEn(
            'cabecera-superior',
            crearCabeceraCompleta([
              { etiqueta: 'Home', enlace: 'home.html' },
              { etiqueta: 'Inventario', enlace: 'inventario.html' },
              { etiqueta: 'Secciones', enlace: 'secciones.html' },
              { etiqueta: seccionActual.nombre },
            ]),
          );
          const accionesDelHeader =
            crearCajaDeBusqueda('Buscar equipo...', 'input-buscar-equipo') +
            '<button class="boton boton--primary regla-diseno-005" type="button" data-modal-open="modal-equipo">' +
            crearIcono('plus', 'icon-sm') +
            '<span>Agregar equipo</span></button>';
          mostrarEn(
            'cabecera-de-pagina',
            crearCabeceraDePagina({
              titulo: seccionActual.nombre,
              volverA: 'secciones.html',
              insignia: equiposDeLaSeccion.length + ' equipos',
              acciones: accionesDelHeader,
            }),
          );
        }
        async function renderEquipos() {
          if (!seccionActual) {
            mostrarEn(
              'lista-de-equipos',
              crearEstadoVacio({
                icono: 'building-2',
                titulo: 'No hay secciones disponibles',
                descripcion: 'Crea una seccion para poder cargar equipos.',
              }),
            );
            dibujarIconos();
            return;
          }
          const equiposDeLaSeccion = await obtenerEquiposPorSeccionInventario(seccionActual.id);
          let htmlDeFilas = '';
          if (equiposDeLaSeccion.length === 0) {
            htmlDeFilas = crearEstadoVacio({
              icono: 'monitor',
              titulo: 'No hay equipos en esta seccion',
              descripcion: 'Usa Agregar equipo para dar de alta televisores, all in one, torres, perifericos o monitores.',
            });
          } else {
            for (let i = 0; i < equiposDeLaSeccion.length; i++) {
              htmlDeFilas += crearFilaDeEquipo(equiposDeLaSeccion[i], {
                permitirBaja: true,
                permitirTraslado: true,
              });
            }
          }
          mostrarEn('lista-de-equipos', htmlDeFilas);
          activarBuscador('input-buscar-equipo', '#lista-de-equipos .list-row');
          dibujarIconos();
        }
        const cuerpoModalEquipo =
          '<div class="input-stack regla-diseno-025">' +
          '<label for="nuevo-equipo-nombre">Nombre del equipo</label>' +
          '<input class="text-input regla-diseno-026" id="nuevo-equipo-nombre" type="text" placeholder="Ej. Monitor biblioteca 1" data-clave-placeholder="ej_monitor" />' +
          '</div>' +
          '<div class="input-stack regla-diseno-025">' +
          '<label for="nuevo-equipo-tipo">Tipo de equipo</label>' +
          '<select class="select-input regla-diseno-026" id="nuevo-equipo-tipo">' +
          opcionesTiposEquipo() +
          '</select>' +
          '</div>' +
          '<div class="input-stack regla-diseno-025">' +
          '<label for="nuevo-equipo-observaciones">Observaciones</label>' +
          '<textarea class="textarea-input regla-diseno-026" id="nuevo-equipo-observaciones" rows="3" placeholder="Detalle opcional del estado o ubicacion dentro del salon." data-clave-placeholder="detalle_opcional_equipo"></textarea>' +
          '</div>';
        const pieModalEquipo =
          '<button class="boton boton--outline regla-diseno-005" type="button" data-modal-close data-clave="cancelar">Cancelar</button>' +
          '<button class="boton boton--primary regla-diseno-005" type="button" data-save-equipo>Dar de alta</button>';
        const cuerpoModalTraslado =
          '<p class="dialogo__move-summary" id="equipo-traslado-resumen">Selecciona un equipo para trasladar.</p>' +
          '<div class="input-stack regla-diseno-025">' +
          '<label for="equipo-seccion-destino-lista">Seccion destino</label>' +
          '<select class="select-input regla-diseno-026" id="equipo-seccion-destino-lista">' +
          '<option value="">Elegir seccion</option>' +
          '</select>' +
          '</div>';
        const pieModalTraslado =
          '<button class="boton boton--outline regla-diseno-005" type="button" data-modal-close>Cancelar</button>' +
          '<button class="boton boton--primary regla-diseno-005" type="button" data-confirm-move-equipo>Confirmar traslado</button>';
        mostrarEn(
          'contenedor-modal',
          crearModal({
            id: 'modal-equipo',
            titulo: 'Agregar equipo',
            icono: 'monitor',
            cuerpo: cuerpoModalEquipo,
            pieDeModal: pieModalEquipo,
          }) +
            crearModal({
              id: 'modal-traslado-equipo-lista',
              titulo: 'Trasladar equipo',
              icono: 'move-right',
              claseDialogo: 'dialogo--traslado-equipo',
              cuerpo: cuerpoModalTraslado,
              pieDeModal: pieModalTraslado,
          }) +
            crearModalBajaEquipoInventario('modal-baja-equipo'),
        );

        function limpiarFormularioEquipo() {
          document.getElementById('nuevo-equipo-nombre').value = '';
          document.getElementById('nuevo-equipo-tipo').value = '';
          document.getElementById('nuevo-equipo-observaciones').value = '';
        }

        function opcionesSeccionesDestinoTraslado(equipo) {
          let opciones = '<option value="">Elegir seccion</option>';
          let cantidadDestinos = 0;
          for (let i = 0; i < seccionesInventario.length; i++) {
            if (String(seccionesInventario[i].id) === String(equipo.seccionId)) {
              continue;
            }
            cantidadDestinos++;
            opciones +=
              '<option value="' +
              obtenerTextoSeguro(seccionesInventario[i].id) +
              '">' +
              obtenerTextoSeguro(seccionesInventario[i].nombre) +
              '</option>';
          }
          if (cantidadDestinos === 0) {
            return '<option value="" disabled>No hay otra seccion disponible</option>';
          }
          return opciones;
        }

        async function abrirModalTrasladoEquipo(equipoId) {
          equipoTrasladoSeleccionado = await obtenerEquipoInventarioPorId(equipoId);
          if (!equipoTrasladoSeleccionado) {
            mostrarMensajeSeccion('No encontramos ese equipo.', 'error');
            return;
          }
          document.getElementById('equipo-traslado-resumen').textContent =
            equipoTrasladoSeleccionado.nombre + ' | Seccion actual: ' + equipoTrasladoSeleccionado.seccion;
          const selectDestino = document.getElementById('equipo-seccion-destino-lista');
          selectDestino.innerHTML = opcionesSeccionesDestinoTraslado(equipoTrasladoSeleccionado);
          const botonConfirmar = document.querySelector('[data-confirm-move-equipo]');
          botonConfirmar.disabled = seccionesInventario.length < 2;
          abrirModal('modal-traslado-equipo-lista');
        }

        async function confirmarTrasladoEquipo() {
          if (!equipoTrasladoSeleccionado) {
            return;
          }
          try {
            const resultado = await moverEquipoInventario(
              equipoTrasladoSeleccionado.id,
              document.getElementById('equipo-seccion-destino-lista').value,
            );
            mostrarMensajeSeccion(resultado.mensaje, resultado.ok ? 'success' : 'error');
            if (!resultado.ok) {
              return;
            }
            cerrarModal('modal-traslado-equipo-lista');
            equipoTrasladoSeleccionado = null;
            await renderCabecera();
            await renderEquipos();
          } catch (error) {
            mostrarMensajeSeccion(error.message, 'error');
          }
        }

        async function guardarEquipoDesdeModal() {
          try {
            const resultado = await guardarNuevoEquipoInventario({
              nombre: document.getElementById('nuevo-equipo-nombre').value,
              tipo: document.getElementById('nuevo-equipo-tipo').value,
              seccionId: seccionActual ? seccionActual.id : '',
              observaciones: document.getElementById('nuevo-equipo-observaciones').value,
            });
            mostrarMensajeSeccion(resultado.mensaje, resultado.ok ? 'success' : 'error');
            if (!resultado.ok) {
              return;
            }
            limpiarFormularioEquipo();
            cerrarModal('modal-equipo');
            await renderCabecera();
            await renderEquipos();
          } catch (error) {
            mostrarMensajeSeccion(error.message, 'error');
          }
        }

        async function eliminarEquipoDesdeSeccion(equipoId) {
          if (!equipoId) {
            return;
          }
          try {
            const resultado = await eliminarEquipoInventario(equipoId);
            mostrarMensajeSeccion(resultado.mensaje, resultado.ok ? 'success' : 'error');
            if (resultado.ok) {
              cerrarModal('modal-baja-equipo');
              limpiarModalBajaEquipoInventario('modal-baja-equipo');
              await renderCabecera();
              await renderEquipos();
            }
          } catch (error) {
            mostrarMensajeSeccion(error.message, 'error');
          }
        }

        document.addEventListener('click', function (evento) {
          const botonCancelarBaja = evento.target.closest('[data-cancel-delete-equipo]');
          if (botonCancelarBaja) {
            cancelarBajaEquipoInventario('modal-baja-equipo');
            return;
          }
          const botonTraslado = evento.target.closest('[data-open-move-equipo]');
          if (botonTraslado) {
            evento.preventDefault();
            evento.stopPropagation();
            abrirModalTrasladoEquipo(botonTraslado.getAttribute('data-open-move-equipo'));
            return;
          }
          const botonConfirmarTraslado = evento.target.closest('[data-confirm-move-equipo]');
          if (botonConfirmarTraslado) {
            confirmarTrasladoEquipo();
            return;
          }
          const botonConfirmarBaja = evento.target.closest('[data-confirm-delete-equipo]');
          if (botonConfirmarBaja) {
            const equipoBaja = obtenerEquipoBajaSeleccionado('modal-baja-equipo');
            eliminarEquipoDesdeSeccion(equipoBaja.id);
            return;
          }
          const botonGuardar = evento.target.closest('[data-save-equipo]');
          if (botonGuardar) {
            guardarEquipoDesdeModal();
            return;
          }
          const botonBaja = evento.target.closest('[data-delete-equipo]');
          if (!botonBaja) {
            return;
          }
          evento.preventDefault();
          evento.stopPropagation();
          abrirModalBajaEquipoInventario(
            'modal-baja-equipo',
            botonBaja.getAttribute('data-delete-equipo'),
            botonBaja.getAttribute('data-equipo-nombre'),
          );
        });
        await renderCabecera();
        await renderEquipos();
        dibujarIconos();
        })();
      }
    </script>
  </body>
</html>
