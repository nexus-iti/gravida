server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 3m;

    # Mismas cabeceras que el .htaccess del proyecto.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://ui-avatars.com; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Bloqueos equivalentes a los FilesMatch del .htaccess.
    location ~ /\. { deny all; }
    location ~* \.(sql|md|log|bak|old|orig|swp|ini|conf|ps1|bat|sh)$ { deny all; }
    location ~ ^/(config(\.example)?\.php|test-api\.html)$ { deny all; }
    location ^~ /seguridad/ { deny all; }

    # Rutas limpias de paginas: /pages/home -> /pages/home.html
    location = /pages { try_files /pages/index.html =404; }
    location ~ ^/pages/([a-z0-9-]+)/?$ { try_files /pages/$1.html =404; }

    # PHP: todo a back (php-fpm). Solo se alcanza por la red interna.
    location ~ \.php$ {
        fastcgi_pass back:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache como el .htaccess: assets versionados con ?v=.
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=3600, must-revalidate"; try_files $uri =404; }
    location ~* \.(jpe?g|png|webp|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
}
