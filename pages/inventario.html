<!doctype html>
<html lang="es" data-tema="claro" data-idioma="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario | Portal de Gestion TI</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="font" type="font/woff2" href="../css/fuentes/host-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="style" href="../css/fuentes.css?v=e5dbd5ae11" onload="this.onload=null;this.rel='stylesheet'" onerror="this.onerror=null;this.remove();document.documentElement.classList.add('fuentes-no-disponibles')" />
    <noscript><link rel="stylesheet" href="../css/fuentes.css?v=e5dbd5ae11" /></noscript>
    <script>try{var t=String(localStorage.getItem('tema')||'').replace(/"/g,'');if(t!=='oscuro'&&t!=='claro')t=matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro';document.documentElement.setAttribute('data-tema',t)}catch(e){}</script>
    <link rel="stylesheet" href="../css/global.css?v=e5dbd5ae11" data-css-critico />
</head>
  <body data-section="inventario" data-requires-auth="true">
    <div id="cabecera-superior"></div>
    <main>
      <div id="cabecera-de-pagina"></div>
      <div id="rejilla-de-modulos" class="module-grid regla-diseno-013"></div>
    </main>
    <script src="../js/router.js?v=e5dbd5ae11"></script>
    
    
    
    
    
    
    
    
    
    
    
    
    <script>
      
      if (protegerRuta()) {
        
        mostrarEn(
          'cabecera-superior',
          crearCabeceraCompleta([
            { etiqueta: 'Home', enlace: 'home.html' },
            { etiqueta: 'Inventario' },
          ]),
        );
        mostrarEn(
          'cabecera-de-pagina',
          crearCabeceraDePagina({
            titulo: 'Inventario',
            subtitulo:
              'Consulta donde esta cada equipo, que cambios tuvo y que respaldo visual existe por seccion.',
            esGrande: true,
          }),
        );
        
        const modulos = [
          {
            icono: 'building-2',
            titulo: 'Secciones del inventario',
            descripcion: 'Entra a cada espacio para revisar los equipos que tiene asignados.',
            enlace: 'secciones.html',
          },
          {
            icono: 'history',
            titulo: 'Historial de cambios',
            descripcion: 'Revisa movimientos, altas, bajas y cambios recientes del inventario.',
            enlace: 'historial.html',
          },
        ];
        
        let htmlTarjetas = '';
        for (let i = 0; i < modulos.length; i++) {
          htmlTarjetas += crearTarjetaDeModulo(modulos[i]);
        }
        mostrarEn('rejilla-de-modulos', htmlTarjetas);
        
        const cabecera = document.querySelector('.page-header');
        if (cabecera) {
          cabecera.style.flexDirection = 'column';
          cabecera.style.alignItems = 'center';
          cabecera.style.textAlign = 'center';
        }
        
        dibujarIconos();
      }
    </script>
  </body>
</html>
