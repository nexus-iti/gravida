# Cache-Control por tipo de recurso (equivalente al .htaccess). Se aplica con un
# unico add_header a nivel server: un add_header dentro de un location anula
# todos los heredados, y antes los CSS/JS salian sin nosniff ni CSP.
#   - CSS/JS con ?v= (hash del contenido, scripts/versionar-assets.mjs): un anio, immutable.
#   - CSS/JS sin ?v=: revalidacion corta.
#   - HTML: no-cache (siempre revalida con ETag y responde 304 si no cambio).
map $uri $nexus_tipo_recurso {
    ~*\.(css|js)$                        asset;
    ~*\.(jpe?g|png|webp|svg|ico|woff2?)$ imagen;
    ~*\.html?$                           html;
    default                              "";
}

map "$nexus_tipo_recurso:$arg_v" $nexus_cache_control {
    ~^asset:.+   "public, max-age=31536000, immutable";
    ~^asset:$    "public, max-age=3600, must-revalidate";
    ~^imagen:    "public, max-age=604800, stale-while-revalidate=86400";
    ~^html:      "no-cache";
    default      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Mismas cabeceras que el .htaccess del proyecto.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://ui-avatars.com; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    # Vacio para PHP y el resto: nginx no agrega la cabecera.
    add_header Cache-Control $nexus_cache_control;

    # Bloqueos equivalentes a los FilesMatch del .htaccess.
    location ~ /\. { deny all; }
    location ~* \.(sql|md|log|bak|old|orig|swp|ini|conf|ps1|bat|sh)$ { deny all; }
    location ~ ^/(config(\.example)?\.php|test-api\.html)$ { deny all; }
    location ^~ /seguridad/ { deny all; }

    # Rutas limpias de paginas: /pages/home -> /pages/home.html
    location = /pages { try_files /pages/index.html =404; }
    location ~ ^/pages/([a-z0-9-]+)/?$ { try_files /pages/$1.html =404; }

    # PHP: todo a back (php-fpm). Solo se alcanza por la red interna.
    location ~ \.php$ {
        fastcgi_pass back:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
