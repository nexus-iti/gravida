<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña | SGRSI</title><link rel="stylesheet" href="css/global.css"></head>
<body><main class="portal-main"><section class="panel-grid"><article class="panel"><div class="panel__body">
<h1>Recuperar contraseña</h1><p>La solicitud se enviará como ticket a técnicos y administradores.</p>
<form id="form-recuperar"><div class="input-stack"><label>Cédula</label><input id="rec-cedula" required maxlength="15"></div><div class="input-stack"><label>Correo registrado</label><input id="rec-correo" type="email" required></div><button class="boton boton--primary" type="submit">Crear ticket</button></form><div id="mensaje-recuperar"></div>
<hr><h2>Consultar solicitud</h2><form id="form-consultar"><div class="input-stack"><label>Cédula</label><input id="con-cedula" required></div><div class="input-stack"><label>Código de seguimiento</label><input id="con-codigo" required maxlength="12"></div><button class="boton boton--outline" type="submit">Consultar</button></form><div id="resultado-consulta"></div><p><a href="login.html">Volver al inicio de sesión</a></p>
</div></article></section></main><script src="js/core/api.js"></script><script>
const mensaje=document.getElementById('mensaje-recuperar'),resultado=document.getElementById('resultado-consulta');
document.getElementById('form-recuperar').addEventListener('submit',async e=>{e.preventDefault();try{const r=await solicitarApi('api/recuperacion.php',{method:'POST',body:JSON.stringify({cedula:document.getElementById('rec-cedula').value,correo:document.getElementById('rec-correo').value})});mensaje.innerHTML='<div class="form-message form-message--success">Ticket creado. Guardá este código: <strong>'+r.codigo+'</strong></div>';}catch(x){mensaje.innerHTML='<div class="form-message form-message--error">'+x.message+'</div>';}});
document.getElementById('form-consultar').addEventListener('submit',async e=>{e.preventDefault();try{const r=await solicitarApi('api/recuperacion.php',{method:'POST',body:JSON.stringify({accion:'consultar',cedula:document.getElementById('con-cedula').value,codigo:document.getElementById('con-codigo').value})});let html='<div class="form-message form-message--success">Estado: <strong>'+r.estado+'</strong>';if(r.contrasenaTemporal)html+='<br>Contraseña temporal (se muestra una sola vez): <strong>'+r.contrasenaTemporal+'</strong>';html+='</div>';resultado.innerHTML=html;}catch(x){resultado.innerHTML='<div class="form-message form-message--error">'+x.message+'</div>';}});
</script></body></html>
