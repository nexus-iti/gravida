<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña | SGRSI</title><link rel="stylesheet" href="../css/global.css"></head>
<body data-requires-auth="true"><main class="portal-main"><article class="panel"><div class="panel__body"><h1>Definir una nueva contraseña</h1><p>La contraseña temporal debe reemplazarse antes de continuar.</p><form id="form-clave"><div class="input-stack"><label for="clave" data-clave="contrasena_nueva_sin_enie">Contraseña nueva (sin Ñ)</label><input id="clave" type="password" placeholder="Sin la letra Ñ" required minlength="8"></div><div class="input-stack"><label for="clave2" data-clave="repetir_contrasena_nueva_sin_enie">Repetir contraseña nueva (sin Ñ)</label><input id="clave2" type="password" placeholder="Sin la letra Ñ" required minlength="8"></div><button class="boton boton--primary" type="submit">Actualizar contraseña</button></form><div id="mensaje" aria-live="polite" aria-atomic="true"></div></div></article></main>
<script src="../js/router.js?v=5.0.0"></script><script>
const u=obtenerUsuarioActual();if(!u)location.href='login.html';document.getElementById('form-clave').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('clave').value,b=document.getElementById('clave2').value;if(a!==b){document.getElementById('mensaje').textContent='Las contraseñas no coinciden.';return;}const v=validarContrasenaSegura(a);if(!v.ok){document.getElementById('mensaje').textContent=t(v.mensaje);return;}try{await solicitarApi('api/usuarios.php',{method:'PATCH',body:JSON.stringify({accion:'cambiar_contrasena',cedula:u.cedula,contrasena:a})});u.debeCambiarContrasena=false;guardarUsuarioActual(u,{persistir:false});location.href='home.html';}catch(x){document.getElementById('mensaje').textContent=x.message;}});
</script></body></html>
