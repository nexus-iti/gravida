<!doctype html>
<html lang="es" data-tema="claro" data-idioma="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitudes de servicio | Portal de Gestión TI</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="font" type="font/woff2" href="../css/fuentes/host-grotesk-latin.woff2" crossorigin />
    <link rel="preload" as="style" href="../css/fuentes.css?v=da36595f64" onload="this.onload=null;this.rel='stylesheet'" onerror="this.onerror=null;this.remove();document.documentElement.classList.add('fuentes-no-disponibles')" />
    <noscript><link rel="stylesheet" href="../css/fuentes.css?v=da36595f64" /></noscript>
    <script>try{var t=String(localStorage.getItem('tema')||'').replace(/"/g,'');if(t!=='oscuro'&&t!=='claro')t=matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro';document.documentElement.setAttribute('data-tema',t)}catch(e){}</script>

</head>
  <body data-section="solicitudes" data-requires-auth="true">
    <div id="cabecera-superior"></div>
    <main class="portal-main regla-diseno-001">
      <div id="cabecera-de-pagina"></div>
      <section class="panel regla-diseno-032">
        <div class="panel__header regla-diseno-009">
          <div>
            <h2 class="panel__title regla-diseno-010" id="titulo-panel-solicitud" data-clave="pedir_servicio">
              Pedir un servicio
            </h2>
          </div>
        </div>
        <div class="panel__body regla-diseno-012">
          <form id="form-solicitud" class="auth-form regla-diseno-033">
            <div class="field-grid regla-diseno-024">
              <div class="input-stack regla-diseno-025">
                <label for="solicitud-tipo" data-clave="tipo_de_servicio">Tipo de servicio</label>
                <select
                  class="select-input regla-diseno-026"
                  id="solicitud-tipo"
                  required
                ></select>
              </div>
              <div class="input-stack regla-diseno-025">
                <label for="solicitud-fecha" data-clave="fecha_deseada">Fecha deseada</label>
                <input
                  class="text-input regla-diseno-026"
                  id="solicitud-fecha"
                  type="date"
                  required
                />
              </div>
            </div>
            <div class="input-stack regla-diseno-025">
              <label for="solicitud-lugar" data-clave="salon">Salón</label>
              <select
                class="select-input regla-diseno-026"
                id="solicitud-lugar"
                required
              ></select>
            </div>
            <div class="input-stack regla-diseno-025">
              <label for="solicitud-detalle" data-clave="que_hay_que_preparar">Que hay que preparar</label>
              <textarea
                class="textarea-input regla-diseno-026"
                id="solicitud-detalle"
                placeholder="Ej. Instalar software, dejar el salón pronto o preparar material didáctico."
                required
               data-clave-placeholder="ej_servicio"></textarea>
            </div>
            <div class="form-actions regla-diseno-035">
              <button
                class="boton boton--primary regla-diseno-005"
                type="submit"
               data-clave="enviar_solicitud">
                Enviar solicitud
              </button>
            </div>
          </form>
        </div>
      </section>
      <section class="panel regla-diseno-032">
        <div class="panel__body regla-diseno-012">
          <div class="filter-panel regla-diseno-033">
            <div id="filtros-solicitudes" class="field-grid filter-panel__body regla-diseno-024"></div>
          </div>
          <div id="mensaje-solicitudes" aria-live="polite" aria-atomic="true"></div>
            <div id="lista-solicitudes" data-esqueleto="filas" class="activity-stack regla-diseno-033"></div>
        </div>
      </section>
    </main>
    <script src="../js/router.js?v=da36595f64"></script>
    
    
    
    
    
    
    
    
    
    
    
    
    <script>
      (async function iniciarPaginaSolicitudes() {
      if (protegerRuta()) {
        
        mostrarEn(
          'cabecera-superior',
          crearCabeceraCompleta([
            { etiqueta: 'Home', enlace: 'home.html' },
            { etiqueta: 'Solicitudes de servicio' },
          ]),
        );
        mostrarEn(
          'cabecera-de-pagina',
          crearCabeceraDePagina({
            titulo: 'Solicitudes de servicio',
          }),
        );
        
        const selectTipo = document.getElementById('solicitud-tipo');
        const selectLugar = document.getElementById('solicitud-lugar');
        const tituloPanel = document.getElementById('titulo-panel-solicitud');
        const filtrosSolicitudes = document.getElementById('filtros-solicitudes');
        const formSolicitud = document.getElementById('form-solicitud');
        const usuarioActual = obtenerUsuarioActual();
        const esSolicitante = usuarioEsSolicitante(usuarioActual);
        const esTecnico = usuarioEsTecnico(usuarioActual);
        const esAdministrativo = usuarioEsAdministrativo(usuarioActual);
        const puedeSolicitar = usuarioPuedeSolicitar(usuarioActual);
        const puedeGestionar = usuarioPuedeGestionarOperaciones(usuarioActual);
        const opcionesEstadoSolicitud = [
          {
            estado: 'Pendiente',
            etiqueta: 'Pendiente',
            clase: 'boton--outline',
            atributoId: 'data-update-solicitud',
            atributoEstado: 'data-solicitud-status',
            clave: 'pendiente',
          },
          {
            estado: 'En proceso',
            etiqueta: 'En proceso',
            clase: 'boton--outline-primary',
            atributoId: 'data-update-solicitud',
            atributoEstado: 'data-solicitud-status',
            clave: 'en_proceso',
          },
          {
            estado: 'Completado',
            etiqueta: 'Completar',
            clase: 'boton--primary',
            atributoId: 'data-update-solicitud',
            atributoEstado: 'data-solicitud-status',
          },
          {
            estado: 'Denegado',
            etiqueta: 'Denegar',
            clase: 'boton--outline-danger',
            atributoId: 'data-update-solicitud',
            atributoEstado: 'data-solicitud-status',
          },
        ];
        const idsFiltrosSolicitudes = [
          'filtro-solicitud-creador',
          'filtro-solicitud-estado',
          'filtro-solicitud-tipo',
          'filtro-solicitud-lugar',
        ];
        
        if (esSolicitante) {
          actualizarTextoSiExiste(
            'subtitulo-panel-solicitud',
            'Enviá solicitudes y mirá acá mismo cómo avanza cada preparación.',
          );
        } else if (esTecnico) {
          document.getElementById('titulo-panel-solicitud').textContent =
            'Bandeja técnica de solicitudes';
          actualizarTextoSiExiste(
            'subtitulo-panel-solicitud',
            'Acá llegan los pedidos de preparación para revisarlos y actualizar su estado.',
          );
        } else if (esAdministrativo) {
          document.getElementById('titulo-panel-solicitud').textContent =
            'Gestión de solicitudes';
          actualizarTextoSiExiste(
            'subtitulo-panel-solicitud',
            'Desde acá podés crear solicitudes y revisar el estado de las que llegan al portal.',
          );
        }
        
        if (!puedeSolicitar) {
          formSolicitud.closest('.panel').remove();
      
        }
        
        function actualizarTituloPanel() {
          const tipoSeleccionado = selectTipo.value;
          if (tipoSeleccionado) {
            tituloPanel.textContent = tipoSeleccionado;
          } else if (esTecnico) {
            tituloPanel.textContent = 'Bandeja técnica de solicitudes';
          } else if (esAdministrativo) {
            tituloPanel.textContent = 'Gestión de solicitudes';
          } else {
            tituloPanel.textContent = 'Pedir un servicio';
          }
        }
        
        async function renderTipos() {
          const tiposDisponibles = await solicitarApi('api/catalogos.php?tipo=servicio_disponible');
          let opciones = '<option value="" data-clave="elegir_tipo_servicio">Elegir tipo de servicio</option>';
          for (let i = 0; i < tiposDisponibles.length; i++) {
            opciones +=
              '<option value="' + escaparHtml(tiposDisponibles[i].nombre) + '">' + escaparHtml(tiposDisponibles[i].nombre) + '</option>';
          }
          selectTipo.innerHTML = opciones;
          inicializarSelectsPersonalizados(selectTipo);
        }
        
        async function renderLugares() {
          const lugares = await obtenerLugaresDisponibles();
          let opciones = '<option value="" data-clave="elegir_salon">Elegir salón</option>';
          if (lugares.length === 0) {
            opciones +=
              '<option value="" disabled data-clave="no_hay_secciones_cargadas">No hay secciones cargadas</option>';
          }
          for (let i = 0; i < lugares.length; i++) {
            const lugarSeguro = escaparHtml(lugares[i]);
            opciones +=
              '<option value="' + lugarSeguro + '">' + lugarSeguro + '</option>';
          }
          selectLugar.innerHTML = opciones;
          inicializarSelectsPersonalizados(selectLugar);
        }
        
        async function renderFiltrosSolicitudes() {
          const filtrosActuales = guardarValoresCampos(idsFiltrosSolicitudes);
          const solicitudes = await obtenerSolicitudesVisibles();
          filtrosSolicitudes.innerHTML =
            crearCampoFiltroSelect(
              'filtro-solicitud-creador',
              'Creado por',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(solicitudes, 'solicitante'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-solicitud-estado',
              'Estado',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(solicitudes, 'estado'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-solicitud-tipo',
              'Tipo',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(solicitudes, 'tipo'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-solicitud-lugar',
              'Salon',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(solicitudes, 'lugar'), 'Todos'),
            );
          restaurarValoresCampos(filtrosActuales);
          inicializarSelectsPersonalizados(filtrosSolicitudes);
        }

        function obtenerFiltrosSolicitudes() {
          return [
            { campo: 'solicitante', valor: obtenerValorCampoFormulario('filtro-solicitud-creador'), comparacion: 'igual' },
            { campo: 'estado', valor: obtenerValorCampoFormulario('filtro-solicitud-estado'), comparacion: 'igual' },
            { campo: 'tipo', valor: obtenerValorCampoFormulario('filtro-solicitud-tipo'), comparacion: 'igual' },
            { campo: 'lugar', valor: obtenerValorCampoFormulario('filtro-solicitud-lugar'), comparacion: 'igual' },
          ];
        }
        
        async function renderLista() {
          const solicitudes = filtrarRegistrosPorCampos(
            await obtenerSolicitudesVisibles(),
            obtenerFiltrosSolicitudes(),
          );
          let html = '';
          if (solicitudes.length === 0) {
            html =
              '<div class="empty-inline regla-diseno-043">Todavía no hay solicitudes de servicio para mostrar con este perfil.</div>';
          } else {
            for (let i = 0; i < solicitudes.length; i++) {
              let acciones = '';
              if (puedeGestionar) {
                acciones = crearBotonesCambioEstado(solicitudes[i], opcionesEstadoSolicitud);
                if (solicitudes[i].estado === 'Pendiente' || solicitudes[i].estado === 'En proceso') {
                  acciones += '<button class="boton boton--outline boton--sm" type="button" data-editar-solicitud="' + escaparHtml(solicitudes[i].id) + '">Editar</button>';
                }
                acciones += '<button class="boton boton--outline-danger boton--sm" data-baja-solicitud="' + escaparHtml(solicitudes[i].id) + '">Dar de baja</button>';
              }
              html += crearTarjetaDeSolicitud(solicitudes[i], acciones);
            }
          }
          mostrarEn('lista-solicitudes', html);
        }
        
        selectTipo.addEventListener('change', actualizarTituloPanel);
        
        document.addEventListener('click', async function (evento) {
          const botonEditar = evento.target.closest('[data-editar-solicitud]');
          if (botonEditar && puedeGestionar) {
            const id = botonEditar.getAttribute('data-editar-solicitud');
            const solicitud = (await obtenerSolicitudesVisibles()).find(function (registro) {
              return String(registro.id) === String(id);
            });
            if (!solicitud) {
              return;
            }
            const tipos = (await solicitarApi('api/catalogos.php?tipo=servicio_disponible')).map(function (tipo) {
              return tipo.nombre;
            });
            const lugares = await obtenerLugaresDisponibles();
            const datos = await pedirDatosEnDialogo({
              titulo: 'Editar solicitud de servicio',
              cuerpo:
                '<div class="input-stack"><label for="editar-solicitud-tipo">Tipo de servicio</label><select class="select-input" id="editar-solicitud-tipo" name="tipo" required>' +
                crearOpcionesFormulario(tipos, solicitud.tipo, 'Elegir tipo') + '</select></div>' +
                '<div class="input-stack"><label for="editar-solicitud-fecha">Fecha deseada</label><input class="text-input" id="editar-solicitud-fecha" name="fechaDeseada" type="date" required value="' + escaparHtml(solicitud.fechaDeseada || '') + '" /></div>' +
                '<div class="input-stack"><label for="editar-solicitud-lugar">Salón</label><select class="select-input" id="editar-solicitud-lugar" name="lugar" required>' +
                crearOpcionesFormulario(lugares, solicitud.lugar, 'Elige un lugar') + '</select></div>' +
                '<div class="input-stack"><label for="editar-solicitud-detalle">Que hay que preparar</label><textarea class="textarea-input" id="editar-solicitud-detalle" name="detalle" rows="4" required>' + escaparHtml(solicitud.detalle || '') + '</textarea></div>',
            });
            if (!datos) {
              return;
            }
            try {
              await modificarSolicitudServicio(id, Object.assign({ titulo: solicitud.titulo || datos.tipo }, datos));
              mostrarMensajeFormulario('mensaje-solicitudes', 'Solicitud actualizada.', 'success');
              await renderFiltrosSolicitudes();
              await renderLista();
              dibujarIconos();
            } catch (error) { manejarErrorCliente(error, function (texto, tipo) { mostrarMensajeFormulario('mensaje-solicitudes', texto, tipo); }); }
            return;
          }
          const botonBaja = evento.target.closest('[data-baja-solicitud]');
          if (botonBaja && puedeGestionar) {
            await darDeBajaOperacion('api/servicios.php', botonBaja.getAttribute('data-baja-solicitud'));
            await renderLista(); return;
          }
          const botonGestion = evento.target.closest('[data-update-solicitud]');
          if (!botonGestion || !puedeGestionar) {
            return;
          }
          try {
            await actualizarEstadoSolicitud(
              botonGestion.getAttribute('data-update-solicitud'),
              botonGestion.getAttribute('data-solicitud-status'),
            );
            await renderFiltrosSolicitudes();
            await renderLista();
            dibujarIconos();
          } catch (error) {
            manejarErrorCliente(error);
          }
        });

        filtrosSolicitudes.addEventListener('input', renderLista);
        filtrosSolicitudes.addEventListener('change', renderLista);
        
        formSolicitud.addEventListener('submit', async function (evento) {
          evento.preventDefault();
          if (!puedeSolicitar) {
            return;
          }
          if (!validarFormularioCliente(formSolicitud)) {
            return;
          }
          try {
            const tipo = selectTipo.value;
            await guardarNuevaSolicitud({
              titulo: tipo,
              tipo: tipo,
              fecha: document.getElementById('solicitud-fecha').value,
              lugar: selectLugar.value,
              detalle: document.getElementById('solicitud-detalle').value,
            });
            formSolicitud.reset();
            actualizarTituloPanel();
            await renderFiltrosSolicitudes();
            await renderLista();
            dibujarIconos();
          } catch (error) {
            manejarErrorCliente(error);
          }
        });

        await renderTipos();
        await renderLugares();
        actualizarTituloPanel();
        await renderFiltrosSolicitudes();
        await renderLista();
        dibujarIconos();
      }
      })();
    </script>
  </body>
</html>
