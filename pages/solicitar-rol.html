<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar cambio de rol | SGRSI</title><link rel="stylesheet" href="../css/global.css"></head>
<body data-requires-auth="true"><main class="portal-main"><article class="panel"><div class="panel__body"><h1>Solicitar cambio de rol</h1><form id="form-rol"><div class="input-stack"><label for="rol">Rol solicitado</label><select id="rol" required><option value="Usuario solicitante">Solicitante</option><option value="Usuario tecnico">Técnico asistente</option><option value="Usuario administrativo">Administrador</option></select></div><div class="input-stack"><label for="motivo">Motivo</label><textarea id="motivo" required></textarea></div><button class="boton boton--primary" type="submit">Enviar solicitud</button></form><div id="mensaje" aria-live="polite" aria-atomic="true"></div><p><a href="cuenta.html">Volver a mi cuenta</a></p></div></article></main>
<script src="../js/router.js?v=5.0.0"></script><script>
if(!protegerRuta())throw new Error('Sin sesión');const u=obtenerUsuarioActual();document.getElementById('form-rol').addEventListener('submit',async e=>{e.preventDefault();try{await solicitarApi('api/cambios_rol.php',{method:'POST',body:JSON.stringify({cedula:u.cedula,rolSolicitado:document.getElementById('rol').value,motivo:document.getElementById('motivo').value})});document.getElementById('mensaje').innerHTML='<div class="form-message form-message--success">Solicitud enviada.</div>';}catch(x){document.getElementById('mensaje').innerHTML='<div class="form-message form-message--error">'+x.message+'</div>';}});
</script></body></html>
