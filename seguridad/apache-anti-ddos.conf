# F-10 (3ra entrega): endurecimiento de Apache contra DDoS de conexiones (Slowloris, conexiones colgadas,
# encabezados gigantes). Estas directivas NO funcionan en .htaccess: van en la configuracion del servidor.
#
# Instalacion (una vez): agregar esta linea al FINAL de C:\xampp\apache\conf\httpd.conf
#   Include "C:/xampp/htdocs/proyecto 2da entrega 4.0/seguridad/apache-anti-ddos.conf"
# Probar la sintaxis antes de reiniciar:   C:\xampp\apache\bin\httpd.exe -t
# Despues, reiniciar Apache desde el panel de XAMPP.

# XAMPP trae mod_reqtimeout pero DESACTIVADO (comentado en httpd.conf): se carga aca.
<IfModule !reqtimeout_module>
    LoadModule reqtimeout_module modules/mod_reqtimeout.so
</IfModule>

# Slowloris: el cliente tiene 10 s para empezar a mandar encabezados y hasta 20 s si sigue enviando
# al menos 500 bytes por segundo. Lo mismo para el cuerpo. Un atacante que manda un byte cada tanto
# para tener la conexion ocupada queda afuera.
<IfModule reqtimeout_module>
    RequestReadTimeout handshake=5 header=10-20,MinRate=500 body=10-30,MinRate=500
</IfModule>

# XAMPP usa 300 s por defecto: cada conexion colgada ocupa un hilo cinco minutos.
Timeout 30

# Conexiones persistentes cortas: un cliente no puede retener un hilo sin pedir nada.
KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 100

# Encabezados y lineas de pedido acotados (las peticiones gigantes consumen memoria).
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 4096

# Windows (mpm_winnt): mas hilos para aguantar picos. Cada hilo usa poca memoria.
<IfModule mpm_winnt_module>
    ThreadsPerChild 250
    MaxConnectionsPerChild 0
</IfModule>

# Sin firma ni version: no se le regala informacion al atacante.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
