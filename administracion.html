<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración 2.0 | SGRSI</title><link rel="stylesheet" href="css/global.css?v=4.1.1"></head>
<body data-section="administracion" data-requires-auth="true" style="visibility:hidden"><main class="portal-main"><h1>Administración 2.0</h1><p><a href="home.html">Volver al inicio</a></p><div id="mensaje"></div>
<section class="panel-grid"><article class="panel"><div class="panel__body"><h2>Configuración</h2><label>Días máximos de préstamo <input id="dias" type="number" min="1" max="365"></label><label><input id="registro" type="checkbox"> Registro habilitado</label><button class="boton boton--primary" id="guardar-config">Guardar</button></div></article>
<article class="panel"><div class="panel__body"><h2>Solicitudes de cambio de rol</h2><div id="roles"></div></div></article></section>
<section class="panel-grid"><article class="panel"><div class="panel__body"><h2>Cuentas de usuario</h2><p>Desde aca podes habilitar las cuentas pendientes o inactivas.</p><div id="cuentas"></div></div></article></section>
<section class="panel-grid"><article class="panel"><div class="panel__body"><h2>Servicios disponibles</h2><button class="boton boton--primary" data-nuevo="servicio_disponible">Agregar</button><div id="servicio_disponible"></div></div></article>
<article class="panel"><div class="panel__body"><h2>Categorías de préstamo</h2><button class="boton boton--primary" data-nuevo="categoria_prestamo">Agregar</button><div id="categoria_prestamo"></div></div></article>
<article class="panel"><div class="panel__body"><h2>Categorías tecnológicas</h2><button class="boton boton--primary" data-nuevo="categoria_tecnologica">Agregar</button><div id="categoria_tecnologica"></div></div></article></section></main>
<script src="js/datos.js"></script><script src="js/traducciones.js"></script><script src="js/core/ui.js"></script><script src="js/core/api.js"></script><script src="js/core/portal.js"></script><script src="js/modules/usuarios.js"></script><script src="js/core/sesion.js"></script><script>
if(!protegerRuta())throw new Error('Sin sesión');const usuarioAdministrador=obtenerUsuarioActual();if(!usuarioEsAdministrativo(usuarioAdministrador)){location.href='home.html';}else{document.body.style.visibility='visible';}const mensaje=document.getElementById('mensaje');
async function cargarCatalogo(tipo){const datos=await solicitarApi('api/catalogos.php?tipo='+tipo+'&incluirInactivos=1');document.getElementById(tipo).innerHTML=datos.map(x=>'<p><strong>'+x.nombre+'</strong> - '+(Number(x.activo)?'Activo':'Inactivo')+' <button data-editar="'+tipo+'" data-id="'+x.id+'" data-nombre="'+x.nombre+'">Editar</button> <button data-baja="'+tipo+'" data-id="'+x.id+'">Baja</button></p>').join('')||'<p>Sin registros.</p>';}
async function cargarRoles(){const datos=await solicitarApi('api/cambios_rol.php');document.getElementById('roles').innerHTML=datos.map(x=>'<p><strong>'+x.usuario+'</strong>: '+x.rolActual+' → '+x.rolSolicitado+' ('+x.estado+') '+(x.estado==='Pendiente'?'<button data-rol="Aprobado" data-id="'+x.id+'">Aprobar</button> <button data-rol="Rechazado" data-id="'+x.id+'">Rechazar</button>':'')+'</p>').join('')||'<p>Sin solicitudes.</p>';}
async function cargarConfig(){const c=await solicitarApi('api/configuracion.php');document.getElementById('dias').value=c.dias_maximos_prestamo?.valor||30;document.getElementById('registro').checked=(c.registro_habilitado?.valor||'1')==='1';}
async function cargarCuentas(){const datos=await solicitarApi('api/usuarios.php');document.getElementById('cuentas').innerHTML=datos.map(x=>'<p><strong>'+x.nombreCompleto+'</strong> - '+x.rol+' - '+(x.estadoRegistro==='activo'?'Activa':'Inactiva')+' '+(x.estadoRegistro==='activo'?'<button data-estado-cuenta="Inactivo" data-cedula-cuenta="'+x.cedula+'">Deshabilitar</button>':'<button data-estado-cuenta="Activo" data-cedula-cuenta="'+x.cedula+'">Habilitar cuenta</button>')+'</p>').join('')||'<p>Sin cuentas.</p>';}
document.addEventListener('click',async e=>{try{if(e.target.dataset.nuevo){const nombre=prompt('Nombre');if(nombre)await solicitarApi('api/catalogos.php?tipo='+e.target.dataset.nuevo,{method:'POST',body:JSON.stringify({nombre})});await cargarCatalogo(e.target.dataset.nuevo);}if(e.target.dataset.editar){const nombre=prompt('Nuevo nombre',e.target.dataset.nombre);if(nombre)await solicitarApi('api/catalogos.php?tipo='+e.target.dataset.editar,{method:'PATCH',body:JSON.stringify({id:e.target.dataset.id,nombre,activo:true})});await cargarCatalogo(e.target.dataset.editar);}if(e.target.dataset.baja){await solicitarApi('api/catalogos.php?tipo='+e.target.dataset.baja,{method:'DELETE',body:JSON.stringify({id:e.target.dataset.id})});await cargarCatalogo(e.target.dataset.baja);}if(e.target.dataset.rol){await solicitarApi('api/cambios_rol.php',{method:'PATCH',body:JSON.stringify({id:e.target.dataset.id,estado:e.target.dataset.rol,revisorCedula:usuarioAdministrador.cedula})});await cargarRoles();}if(e.target.dataset.estadoCuenta){if(e.target.dataset.cedulaCuenta===usuarioAdministrador.cedula&&e.target.dataset.estadoCuenta==='Inactivo')throw new Error('No podes deshabilitar tu propia cuenta.');await solicitarApi('api/usuarios.php',{method:'PATCH',body:JSON.stringify({accion:'estado',cedula:e.target.dataset.cedulaCuenta,estado:e.target.dataset.estadoCuenta})});await cargarCuentas();}}catch(x){mensaje.textContent=x.message;}});
document.getElementById('guardar-config').onclick=async()=>{try{await solicitarApi('api/configuracion.php',{method:'PATCH',body:JSON.stringify({clave:'dias_maximos_prestamo',valor:String(document.getElementById('dias').value),cedula:usuarioAdministrador.cedula})});await solicitarApi('api/configuracion.php',{method:'PATCH',body:JSON.stringify({clave:'registro_habilitado',valor:document.getElementById('registro').checked?'1':'0',cedula:usuarioAdministrador.cedula})});mensaje.textContent='Configuración guardada.';}catch(x){mensaje.textContent=x.message;}};
Promise.all(['servicio_disponible','categoria_prestamo','categoria_tecnologica'].map(cargarCatalogo));cargarRoles();cargarConfig();cargarCuentas();
</script></body></html>
