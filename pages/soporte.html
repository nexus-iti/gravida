<!doctype html>
<html lang="es" data-tema="claro" data-idioma="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incidencias técnicas | Portal de Gestión TI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
</head>
  <body data-section="soporte" data-requires-auth="true">
    <div id="cabecera-superior"></div>
    <main class="portal-main regla-diseno-001">
      <div id="cabecera-de-pagina"></div>
      <section class="panel-grid panel-grid--single regla-diseno-105">
        <article class="panel regla-diseno-032">
          <div class="panel__header regla-diseno-009">
            <div>
              <h2 class="panel__title regla-diseno-010" id="titulo-panel-soporte" data-clave="pedir_ayuda_tecnica">
                Pedir ayuda técnica
              </h2>
            </div>
          </div>
          <div class="panel__body regla-diseno-012">
            <form id="form-soporte" class="auth-form regla-diseno-033">
              <div class="field-grid regla-diseno-024">
                <div class="input-stack regla-diseno-025">
                  <label for="soporte-asunto" data-clave="asunto">Asunto</label>
                  <input
                    class="text-input regla-diseno-026"
                    id="soporte-asunto"
                    type="text"
                    placeholder="Ej. El proyector no muestra imagen"
                    required
                  data-clave-placeholder="ej_proyector" />
                </div>
                <div class="input-stack regla-diseno-025">
                  <label for="soporte-ubicacion" data-clave="donde">Dónde</label>
                  <select
                    class="select-input regla-diseno-026"
                    id="soporte-ubicacion"
                    required
                  ></select>
                </div>
              </div>
              <div class="input-stack regla-diseno-025">
                <label for="soporte-categoria" data-clave="categoria">Categoría</label>
                <select
                  class="select-input regla-diseno-026"
                  id="soporte-categoria"
                  required
                ></select>
              </div>
              <div class="input-stack regla-diseno-025">
                <label for="soporte-mensaje" data-clave="que_esta_pasando">Qué está pasando</label>
                <textarea
                  class="textarea-input regla-diseno-026"
                  id="soporte-mensaje"
                  placeholder="Describe el problema, desde cuando ocurre y que probaste hasta ahora."
                  required
                 data-clave-placeholder="describe_problema_soporte"></textarea>
              </div>
              <div class="form-actions regla-diseno-035">
                <button
                  class="boton boton--primary regla-diseno-005"
                  type="submit"
                 data-clave="enviar_consulta">
                  Enviar consulta
                </button>
              </div>
            </form>
          </div>
        </article>
        <article class="panel regla-diseno-032">
          <div class="panel__body regla-diseno-012">
            <div class="filter-panel regla-diseno-033">
              <div id="filtros-soporte" class="field-grid filter-panel__body regla-diseno-024"></div>
            </div>
            <div id="mensaje-soporte" aria-live="polite" aria-atomic="true"></div>
            <div id="lista-soporte" class="activity-stack regla-diseno-033"></div>
          </div>
        </article>
        <article class="panel regla-diseno-032" id="panel-tickets-borrados" hidden>
          <div class="panel__header regla-diseno-009">
            <div>
              <h2 class="panel__title regla-diseno-010">
                Tickets borrados <span class="etiqueta" id="contador-tickets-borrados">0</span>
              </h2>
              <p class="panel__subtitle">Tickets dados de baja. Quedan registrados y ya no aparecen en la bandeja.</p>
            </div>
          </div>
          <div class="panel__body regla-diseno-012">
            <div id="lista-tickets-borrados" class="activity-stack regla-diseno-033"></div>
          </div>
        </article>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../js/router.js?v=5.0.0"></script>
    
    
    
    
    
    
    
    
    
    
    
    
    <script>
      (async function iniciarPaginaSoporte() {
      if (protegerRuta()) {
        
        mostrarEn(
          'cabecera-superior',
          crearCabeceraCompleta([
            { etiqueta: 'Home', enlace: 'home.html' },
            { etiqueta: 'Incidencias técnicas' },
          ]),
        );
        mostrarEn(
          'cabecera-de-pagina',
          crearCabeceraDePagina({
            titulo: 'Incidencias técnicas',
          }),
        );
        
        const selectCategoria = document.getElementById('soporte-categoria');
        const selectUbicacion = document.getElementById('soporte-ubicacion');
        const filtrosSoporte = document.getElementById('filtros-soporte');
        const formSoporte = document.getElementById('form-soporte');
        const usuarioActual = obtenerUsuarioActual();
        const esSolicitante = usuarioEsSolicitante(usuarioActual);
        const esTecnico = usuarioEsTecnico(usuarioActual);
        const esAdministrativo = usuarioEsAdministrativo(usuarioActual);
        const puedeSolicitar = usuarioPuedeSolicitar(usuarioActual);
        const puedeGestionar = usuarioPuedeGestionarOperaciones(usuarioActual);
        const opcionesEstadoTicket = [
          {
            estado: 'En revision',
            etiqueta: 'En revision',
            clase: 'boton--outline',
            atributoId: 'data-update-ticket',
            atributoEstado: 'data-ticket-status',
            clave: 'en_revision',
          },
          {
            estado: 'Resuelto',
            etiqueta: 'Resolver',
            clase: 'boton--primary',
            atributoId: 'data-update-ticket',
            atributoEstado: 'data-ticket-status',
          },
          {
            estado: 'Denegado',
            etiqueta: 'Denegar',
            clase: 'boton--outline-danger',
            atributoId: 'data-update-ticket',
            atributoEstado: 'data-ticket-status',
          },
        ];
        const idsFiltrosSoporte = [
          'filtro-soporte-creador',
          'filtro-soporte-estado',
          'filtro-soporte-categoria',
          'filtro-soporte-ubicacion',
        ];
        
        if (esSolicitante) {
          actualizarTextoSiExiste(
            'subtitulo-panel-soporte',
            'Enviá consultas y seguí acá mismo si están en revisión, resueltas o denegadas.',
          );
        } else if (esTecnico) {
          document.getElementById('titulo-panel-soporte').textContent =
            'Bandeja técnica de soporte';
          actualizarTextoSiExiste(
            'subtitulo-panel-soporte',
            'Acá llegan los tickets para priorizarlos, responderlos y cerrarlos cuando queden resueltos.',
          );
        } else if (esAdministrativo) {
          document.getElementById('titulo-panel-soporte').textContent = 'Gestión de soporte';
          actualizarTextoSiExiste(
            'subtitulo-panel-soporte',
            'Desde acá podés crear consultas y revisar el avance de los tickets del portal.',
          );
        }
        
        if (!puedeSolicitar) {
          formSoporte.closest('.panel').remove();
          
        }
        
        function renderCategorias() {
          let opciones = '<option value="" data-clave="elegir_categoria">Elegir categoría</option>';
          for (let i = 0; i < categoriasDeSoporte.length; i++) {
            opciones +=
              '<option value="' +
              categoriasDeSoporte[i] +
              '">' +
              categoriasDeSoporte[i] +
              '</option>';
          }
          selectCategoria.innerHTML = opciones;
          inicializarSelectsPersonalizados(selectCategoria);
        }
        
        async function renderLugares() {
          const lugares = await obtenerLugaresDisponibles();
          let opciones = '<option value="" data-clave="elige_lugar">Elige un lugar</option>';
          if (lugares.length === 0) {
            opciones +=
              '<option value="" disabled data-clave="no_hay_secciones_cargadas">No hay secciones cargadas</option>';
          }
          for (let i = 0; i < lugares.length; i++) {
            const lugarSeguro = escaparHtml(lugares[i]);
            opciones +=
              '<option value="' + lugarSeguro + '">' + lugarSeguro + '</option>';
          }
          selectUbicacion.innerHTML = opciones;
          inicializarSelectsPersonalizados(selectUbicacion);
        }
        
        async function renderFiltrosSoporte() {
          const filtrosActuales = guardarValoresCampos(idsFiltrosSoporte);
          const tickets = await obtenerTicketsVisibles();
          filtrosSoporte.innerHTML =
            crearCampoFiltroSelect(
              'filtro-soporte-creador',
              'Creado por',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(tickets, 'solicitante'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-soporte-estado',
              'Estado',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(tickets, 'estado'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-soporte-categoria',
              'Categoria',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(tickets, 'categoria'), 'Todas'),
            ) +
            crearCampoFiltroSelect(
              'filtro-soporte-ubicacion',
              'Ubicacion',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(tickets, 'ubicacion'), 'Todas'),
            );
          restaurarValoresCampos(filtrosActuales);
          inicializarSelectsPersonalizados(filtrosSoporte);
        }

        function obtenerFiltrosSoporte() {
          return [
            { campo: 'solicitante', valor: obtenerValorCampoFormulario('filtro-soporte-creador'), comparacion: 'igual' },
            { campo: 'estado', valor: obtenerValorCampoFormulario('filtro-soporte-estado'), comparacion: 'igual' },
            { campo: 'categoria', valor: obtenerValorCampoFormulario('filtro-soporte-categoria'), comparacion: 'igual' },
            { campo: 'ubicacion', valor: obtenerValorCampoFormulario('filtro-soporte-ubicacion'), comparacion: 'igual' },
          ];
        }
        
        let responsablesSoporte = [];

        function mostrarMensajeSoporte(texto, tipo) {
          mostrarMensajeFormulario('mensaje-soporte', texto, tipo);
        }

        function opcionesResponsablesSoporte(seleccionado) {
          let html = '<option value="">Elegir persona</option>';
          for (let i = 0; i < responsablesSoporte.length; i++) {
            const responsable = responsablesSoporte[i];
            html +=
              '<option value="' + escaparHtml(responsable.id) + '"' +
              (String(responsable.id) === String(seleccionado) ? ' selected' : '') + '>' +
              escaparHtml(responsable.nombreCompleto) + '</option>';
          }
          return html;
        }

        function crearGestionTicket(ticket) {
          const id = escaparHtml(ticket.id);
          return (
            '<div class="ticket-gestion">' +
            '<label class="input-stack"><span>Asignar a</span><select class="select-input" data-asignar-ticket-select="' + id + '">' +
            opcionesResponsablesSoporte(ticket.tecnicoId) + '</select></label>' +
            '<button class="boton boton--outline boton--sm" type="button" data-asignar-ticket="' + id + '">Asignar</button>' +
            '</div>' +
            '<details class="ticket-diagnostico"><summary>Diagnóstico</summary>' +
            '<div class="ticket-diagnostico__form">' +
            '<label class="input-stack"><span>Diagnóstico</span><textarea class="textarea-input" data-diagnostico-ticket="' + id + '">' + escaparHtml(ticket.diagnostico || '') + '</textarea></label>' +
            '<label class="input-stack"><span>Solución</span><textarea class="textarea-input" data-solucion-ticket="' + id + '">' + escaparHtml(ticket.solucion || '') + '</textarea></label>' +
            '<button class="boton boton--primary boton--sm" type="button" data-guardar-diagnostico-ticket="' + id + '">Guardar diagnóstico</button>' +
            '</div></details>'
          );
        }

        async function renderTicketsBorrados() {
          if (!puedeGestionar) {
            return;
          }
          const borrados = await obtenerTicketsDadosDeBaja();
          document.getElementById('panel-tickets-borrados').hidden = false;
          document.getElementById('contador-tickets-borrados').textContent = String(borrados.length);
          let html = '';
          if (borrados.length === 0) {
            html = '<div class="empty-inline regla-diseno-043">Todavía no hay tickets borrados.</div>';
          }
          for (let i = 0; i < borrados.length; i++) {
            html += crearTarjetaDeTicket(
              borrados[i],
              '<span class="etiqueta">Dado de baja el ' + obtenerFechaSegura(borrados[i].fechaCierre) + '</span>',
            );
          }
          mostrarEn('lista-tickets-borrados', html);
        }

        async function renderLista() {
          const tickets = filtrarRegistrosPorCampos(
            await obtenerTicketsVisibles(),
            obtenerFiltrosSoporte(),
          );
          let html = '';
          if (tickets.length === 0) {
            html =
              '<div class="empty-inline regla-diseno-043">Todavía no hay tickets de soporte para mostrar con este perfil.</div>';
          } else {
            for (let i = 0; i < tickets.length; i++) {
              let acciones = '';
              if (puedeGestionar) {
                acciones = crearBotonesCambioEstado(tickets[i], opcionesEstadoTicket);
                if ((tickets[i].estado === 'Resuelto' || tickets[i].estado === 'Denegado') && !tickets[i].comentarioResolucion) {
                  acciones += '<div class="resolution-comment"><label class="input-stack"><span>Comentario de cierre</span><textarea class="textarea-input" data-comentario-ticket="' + escaparHtml(tickets[i].id) + '" placeholder="Deja una aclaración final para este ticket"></textarea></label><button class="boton boton--primary boton--sm" data-guardar-comentario-ticket="' + escaparHtml(tickets[i].id) + '">Guardar comentario</button></div>';
                }
                acciones += crearGestionTicket(tickets[i]);
                acciones += '<button class="boton boton--outline-danger boton--sm" data-baja-ticket="' + escaparHtml(tickets[i].id) + '" data-baja-titulo="' + escaparHtml(tickets[i].asunto) + '">Dar de baja</button>';
              }
              html += crearTarjetaDeTicket(tickets[i], acciones);
            }
          }
          mostrarEn('lista-soporte', html);
        }
        
        document.addEventListener('click', async function (evento) {
          const botonComentario = evento.target.closest('[data-guardar-comentario-ticket]');
          if (botonComentario && puedeGestionar) {
            const id = botonComentario.getAttribute('data-guardar-comentario-ticket');
            const campo = document.querySelector('[data-comentario-ticket="' + CSS.escape(id) + '"]');
            try {
              botonComentario.disabled = true;
              await guardarComentarioTicket(id, campo ? campo.value : '');
              await renderLista();
            } catch (error) { botonComentario.disabled = false; manejarErrorCliente(error); }
            return;
          }
          const botonAsignar = evento.target.closest('[data-asignar-ticket]');
          if (botonAsignar && puedeGestionar) {
            const id = botonAsignar.getAttribute('data-asignar-ticket');
            const selector = document.querySelector('[data-asignar-ticket-select="' + CSS.escape(id) + '"]');
            if (!selector || !selector.value) {
              mostrarMensajeSoporte('Elegí a quién asignar el ticket.', 'error');
              return;
            }
            try {
              await asignarTicket(id, selector.value);
              mostrarMensajeSoporte('Ticket asignado.', 'success');
              await renderFiltrosSoporte();
              await renderLista();
              dibujarIconos();
            } catch (error) { manejarErrorCliente(error, mostrarMensajeSoporte); }
            return;
          }
          const botonDiagnostico = evento.target.closest('[data-guardar-diagnostico-ticket]');
          if (botonDiagnostico && puedeGestionar) {
            const id = botonDiagnostico.getAttribute('data-guardar-diagnostico-ticket');
            const diagnostico = document.querySelector('[data-diagnostico-ticket="' + CSS.escape(id) + '"]');
            const solucion = document.querySelector('[data-solucion-ticket="' + CSS.escape(id) + '"]');
            try {
              await guardarDiagnosticoTicket(id, diagnostico.value.trim(), solucion.value.trim());
              mostrarMensajeSoporte('Diagnóstico actualizado.', 'success');
              await renderLista();
              dibujarIconos();
            } catch (error) { manejarErrorCliente(error, mostrarMensajeSoporte); }
            return;
          }
          const botonBaja = evento.target.closest('[data-baja-ticket]');
          if (botonBaja && puedeGestionar) {
            const titulo = botonBaja.getAttribute('data-baja-titulo') || '';
            const confirmado = await confirmarAccion({
              titulo: 'Dar de baja ticket',
              mensaje: titulo
                ? '¿Seguro que querés dar de baja el ticket "' + titulo + '"?'
                : '¿Seguro que querés dar de baja este ticket?',
              detalle: 'Va a pasar a la sección Tickets borrados.',
              confirmar: 'Sí, dar de baja',
              icono: 'trash-2',
            });
            if (!confirmado) {
              return;
            }
            try {
              await darDeBajaOperacion('api/incidencias.php', botonBaja.getAttribute('data-baja-ticket'));
              await renderFiltrosSoporte();
              await renderLista();
              await renderTicketsBorrados();
              dibujarIconos();
            } catch (error) { manejarErrorCliente(error, mostrarMensajeSoporte); }
            return;
          }
          const botonGestion = evento.target.closest('[data-update-ticket]');
          if (!botonGestion || !puedeGestionar) {
            return;
          }
          try {
            await actualizarEstadoTicket(
              botonGestion.getAttribute('data-update-ticket'),
              botonGestion.getAttribute('data-ticket-status'),
            );
            await renderFiltrosSoporte();
            await renderLista();
            dibujarIconos();
          } catch (error) {
            manejarErrorCliente(error);
          }
        });

        filtrosSoporte.addEventListener('input', renderLista);
        filtrosSoporte.addEventListener('change', renderLista);
        
        formSoporte.addEventListener('submit', async function (evento) {
          evento.preventDefault();
          if (!puedeSolicitar) {
            return;
          }
          if (!validarFormularioCliente(formSoporte)) {
            return;
          }
          try {
            await guardarNuevoTicket({
              asunto: document.getElementById('soporte-asunto').value,
              categoria: document.getElementById('soporte-categoria').value,
              ubicacion: document.getElementById('soporte-ubicacion').value,
              mensaje: document.getElementById('soporte-mensaje').value,
            });
            formSoporte.reset();
            await renderFiltrosSoporte();
            await renderLista();
            dibujarIconos();
          } catch (error) {
            manejarErrorCliente(error);
          }
        });

        renderCategorias();
        await renderLugares();
        if (puedeGestionar) {
          await obtenerResponsablesTareaRegistrados();
          responsablesSoporte = obtenerResponsablesTareaDelPlantel();
        }
        await renderFiltrosSoporte();
        await renderLista();
        await renderTicketsBorrados();
        dibujarIconos();
      }
      })();
    </script>
  </body>
</html>
