<!doctype html>
<html lang="es" data-tema="claro" data-idioma="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prestamos | Portal de Gestion TI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
</head>
  <body data-section="prestamos" data-requires-auth="true">
    <div id="cabecera-superior"></div>
    <main class="portal-main regla-diseno-001">
      <div id="cabecera-de-pagina"></div>
      <section class="panel-grid panel-grid--single regla-diseno-105">
        <article class="panel regla-diseno-032">
          <div class="panel__header regla-diseno-009">
            <div>
              <h2 class="panel__title regla-diseno-010" id="titulo-panel-prestamo" data-clave="solicitar_un_prestamo">
                Solicitar un prestamo
              </h2>
            </div>
          </div>
          <div class="panel__body regla-diseno-012">
            <form id="form-prestamo" class="auth-form regla-diseno-033">
              <div class="field-grid regla-diseno-024">
                <div class="input-stack regla-diseno-025">
                  <label for="prestamo-categoria" data-clave="filtrar_por_categoria">Filtrar por categoria</label>
                  <select
                    class="select-input regla-diseno-026"
                    id="prestamo-categoria"
                  ></select>
                </div>
              </div>
              <div class="input-stack regla-diseno-025">
                <label data-clave="recursos_y_cantidades">Recursos y cantidades</label>
                <div id="prestamo-recursos" class="loan-selector">
                  <div class="empty-inline regla-diseno-043">
                    Cargando equipos disponibles...
                  </div>
                </div>
              </div>
              <div class="field-grid regla-diseno-024">
                <div class="input-stack regla-diseno-025">
                  <label for="prestamo-fecha" data-clave="fecha">Fecha</label>
                  <input
                    class="text-input regla-diseno-026"
                    id="prestamo-fecha"
                    type="date"
                    required
                  />
                </div>
                <div class="input-stack regla-diseno-025">
                  <label for="prestamo-jornada" data-clave="jornada">Jornada</label>
                  <select
                    class="select-input regla-diseno-026"
                    id="prestamo-jornada"
                    required
                  >
                    <option value="" data-clave="elegir_jornada">Elegir jornada</option>
                    <option value="Mañana" data-clave="manana">Mañana</option>
                    <option value="Tarde" data-clave="tarde">Tarde</option>
                    <option value="Noche" data-clave="noche">Noche</option>
                  </select>
                </div>
              </div>
              <div class="input-stack regla-diseno-025">
                <label for="prestamo-ubicacion" data-clave="lugar_de_entrega">Lugar de entrega</label>
                <select
                  class="select-input regla-diseno-026"
                  id="prestamo-ubicacion"
                  required
                ></select>
              </div>
              <div class="input-stack regla-diseno-025">
                <label for="prestamo-detalle" data-clave="para_que_se_necesita">Para que se necesita</label>
                <textarea
                  class="textarea-input regla-diseno-026"
                  id="prestamo-detalle"
                  placeholder="Ej. Prueba de programacion en el Teorico 3 con el grupo de la mañana."
                  required
                 data-clave-placeholder="ej_prestamo"></textarea>
              </div>
              <div class="form-actions regla-diseno-035">
                <button
                  class="boton boton--primary regla-diseno-005"
                  type="submit"
                 data-clave="enviar_solicitud">
                  Enviar solicitud
                </button>
              </div>
            </form>
          </div>
        </article>
        <article class="panel regla-diseno-032">
          <div class="panel__body regla-diseno-012">
            <div class="filter-panel regla-diseno-033">
              <div id="filtros-prestamos" class="field-grid filter-panel__body regla-diseno-024"></div>
            </div>
            <div id="lista-prestamos" class="activity-stack regla-diseno-033"></div>
          </div>
        </article>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../js/router.js?v=5.0.0"></script>
    
    
    
    
    
    
    
    
    
    
    
    
    <script>
      (async function iniciarPaginaPrestamos() {
      if (protegerRuta()) {
        
        mostrarEn(
          'cabecera-superior',
          crearCabeceraCompleta([
            { etiqueta: 'Home', enlace: 'home.html' },
            { etiqueta: 'Prestamos' },
          ]),
        );
        mostrarEn(
          'cabecera-de-pagina',
          crearCabeceraDePagina({
            titulo: 'Prestamos de equipos',
          }),
        );
        
        const selectCategoria = document.getElementById('prestamo-categoria');
        const selectUbicacion = document.getElementById('prestamo-ubicacion');
        const contenedorRecursos = document.getElementById('prestamo-recursos');
        const filtrosPrestamos = document.getElementById('filtros-prestamos');
        const formPrestamo = document.getElementById('form-prestamo');
        const usuarioActual = obtenerUsuarioActual();
        const esSolicitante = usuarioEsSolicitante(usuarioActual);
        const esTecnico = usuarioEsTecnico(usuarioActual);
        const esAdministrativo = usuarioEsAdministrativo(usuarioActual);
        const puedeSolicitar = usuarioPuedeSolicitar(usuarioActual);
        const puedeGestionar = usuarioPuedeGestionarOperaciones(usuarioActual);
        let equiposPrestamoDisponibles = [];
        const opcionesPendientePrestamo = [
          {
            estado: 'Aprobado',
            etiqueta: t('Aprobar'),
            clase: 'boton--primary',
            atributoId: 'data-update-prestamo',
            atributoEstado: 'data-prestamo-status',
          },
          {
            estado: 'Denegado',
            etiqueta: t('Denegar'),
            clase: 'boton--outline-danger',
            atributoId: 'data-update-prestamo',
            atributoEstado: 'data-prestamo-status',
          },
        ];
        const opcionesAprobadoPrestamo = [
          {
            estado: 'Devuelto',
            etiqueta: t('Marcar como devuelto'),
            clase: 'boton--primary',
            atributoId: 'data-update-prestamo',
            atributoEstado: 'data-prestamo-status',
          },
        ];
        const idsFiltrosPrestamos = [
          'filtro-prestamo-creador',
          'filtro-prestamo-estado',
          'filtro-prestamo-categoria',
        ];
        
        if (esSolicitante) {
          actualizarTextoSiExiste(
            'subtitulo-panel-prestamo',
            'Envia pedidos y segui aca mismo si fueron aprobados, siguen pendientes o fueron denegados.',
          );
        } else if (esTecnico) {
          document.getElementById('titulo-panel-prestamo').textContent =
            'Bandeja tecnica de prestamos';
          actualizarTextoSiExiste(
            'subtitulo-panel-prestamo',
            'Aca llegan los pedidos para que el equipo tecnico los revise y les de respuesta.',
          );
        } else if (esAdministrativo) {
          document.getElementById('titulo-panel-prestamo').textContent =
            'Gestion de prestamos';
          actualizarTextoSiExiste(
            'subtitulo-panel-prestamo',
            'Desde aca podes crear pedidos y revisar los prestamos que llegan al sistema.',
          );
        }
        
        if (!puedeSolicitar) {
          formPrestamo.closest('.panel').remove();
          
        }
        
        let selectorRecursos = null;
        let nombresCategoriasCatalogo = [];

        async function renderCategorias() {
          const datosCategorias = await Promise.all([
            obtenerEquiposDisponiblesParaPrestamo(),
            solicitarApi('api/catalogos.php?tipo=categoria_tecnologica'),
          ]);
          equiposPrestamoDisponibles = datosCategorias[0];
          nombresCategoriasCatalogo = datosCategorias[1].map(function (categoria) {
            return categoria.nombre;
          });
          // El selector filtra la lista: solo ofrece los tipos que tienen equipos.
          const grupos = agruparEquiposPorTipo(equiposPrestamoDisponibles, nombresCategoriasCatalogo);
          let opciones = '<option value= data-clave="todas_las_categorias">Todas las categorias</option>';
          for (let i = 0; i < grupos.length; i++) {
            opciones +=
              '<option value="' + escaparHtml(grupos[i].clave) + '">' + escaparHtml(grupos[i].etiqueta) + '</option>';
          }
          selectCategoria.innerHTML = opciones;
          inicializarSelectsPersonalizados(selectCategoria);
        }

        function renderRecursosPorCategoria() {
          selectorRecursos = iniciarSelectorRecursos(contenedorRecursos, {
            equipos: equiposPrestamoDisponibles,
            categorias: nombresCategoriasCatalogo,
          });
          selectCategoria.value = selectorRecursos.categoriaGuardada;
          if (selectCategoria.value !== selectorRecursos.categoriaGuardada) {
            selectCategoria.value = '';
            selectorRecursos.aplicarCategoria('');
          }
          inicializarSelectsPersonalizados(selectCategoria);
        }

        function obtenerRecursosSeleccionados() {
          return obtenerRecursosSeleccionadosPrestamo(contenedorRecursos);
        }
        
        async function renderLugares() {
          const lugares = await obtenerLugaresDisponibles();
          let opciones = '<option value="" data-clave="elegir_lugar">Elegir lugar</option>';
          if (lugares.length === 0) {
            opciones +=
              '<option value="" disabled data-clave="no_hay_secciones_cargadas">No hay secciones cargadas</option>';
          }
          for (let i = 0; i < lugares.length; i++) {
            const lugarSeguro = escaparHtml(lugares[i]);
            opciones +=
              '<option value="' + lugarSeguro + '">' + lugarSeguro + '</option>';
          }
          selectUbicacion.innerHTML = opciones;
          inicializarSelectsPersonalizados(selectUbicacion);
        }
        
        async function renderFiltrosPrestamos() {
          const filtrosActuales = guardarValoresCampos(idsFiltrosPrestamos);
          const prestamos = await obtenerPrestamosVisibles();
          filtrosPrestamos.innerHTML =
            crearCampoFiltroSelect(
              'filtro-prestamo-creador',
              'Creado por',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(prestamos, 'solicitante'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-prestamo-estado',
              'Estado',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(prestamos, 'estado'), 'Todos'),
            ) +
            crearCampoFiltroSelect(
              'filtro-prestamo-categoria',
              'Categoria',
              crearOpcionesFiltro(obtenerValoresUnicosFiltro(prestamos, 'categoria'), 'Todas'),
            );
          restaurarValoresCampos(filtrosActuales);
          inicializarSelectsPersonalizados(filtrosPrestamos);
        }

        function obtenerFiltrosPrestamos() {
          return [
            { campo: 'solicitante', valor: obtenerValorCampoFormulario('filtro-prestamo-creador'), comparacion: 'igual' },
            { campo: 'estado', valor: obtenerValorCampoFormulario('filtro-prestamo-estado'), comparacion: 'igual' },
            { campo: 'categoria', valor: obtenerValorCampoFormulario('filtro-prestamo-categoria'), comparacion: 'igual' },
          ];
        }
        
        async function renderListaPrestamos() {
          const prestamos = filtrarRegistrosPorCampos(
            await obtenerPrestamosVisibles(),
            obtenerFiltrosPrestamos(),
          );
          let html = '';
          if (prestamos.length === 0) {
            html =
              '<div class="empty-inline regla-diseno-043">Todavia no hay prestamos para mostrar con este perfil.</div>';
          } else {
            for (let i = 0; i < prestamos.length; i++) {
              let acciones = '';
              if (puedeGestionar) {
                if (prestamos[i].estado === 'Pendiente') {
                  acciones = crearBotonesCambioEstado(prestamos[i], opcionesPendientePrestamo);
                } else if (prestamos[i].estado === 'Aprobado') {
                  acciones = crearBotonesCambioEstado(prestamos[i], opcionesAprobadoPrestamo);
                }
                if (prestamos[i].estado === 'Aprobado' || prestamos[i].estado === 'Denegado' || prestamos[i].estado === 'Devuelto') {
                  if (!prestamos[i].comentarioResolucion) {
                    acciones += '<label class="input-stack"><span>' + escaparHtml(t('Comentario asociado')) + '</span><textarea class="textarea-input" data-comentario-prestamo="' + escaparHtml(prestamos[i].id) + '" placeholder="' + escaparAtributo(t('Escribi un comentario sobre el prestamo')) + '"></textarea></label><button class="boton boton--outline boton--sm" data-guardar-comentario-prestamo="' + escaparHtml(prestamos[i].id) + '">' + escaparHtml(t('Guardar comentario')) + '</button>';
                  }
                }
                acciones += '<button class="boton boton--outline-danger boton--sm" data-baja-prestamo="' + escaparHtml(prestamos[i].id) + '">' + escaparHtml(t('Dar de baja')) + '</button>';
              }
              html += crearTarjetaDePrestamo(prestamos[i], acciones);
            }
          }
          mostrarEn('lista-prestamos', html);
        }
        
        document.addEventListener('click', async function (evento) {
          const botonComentario = evento.target.closest('[data-guardar-comentario-prestamo]');
          if (botonComentario && puedeGestionar) {
            const id = botonComentario.getAttribute('data-guardar-comentario-prestamo');
            const campo = document.querySelector('[data-comentario-prestamo="' + CSS.escape(id) + '"]');
            try {
              await guardarComentarioPrestamo(id, campo ? campo.value : '');
              await renderListaPrestamos();
            } catch (error) { manejarErrorCliente(error); }
            return;
          }
          const botonBaja = evento.target.closest('[data-baja-prestamo]');
          if (botonBaja && puedeGestionar) {
            await darDeBajaOperacion('api/prestamos.php', botonBaja.getAttribute('data-baja-prestamo'));
            await renderCategorias();
            renderRecursosPorCategoria();
            await renderListaPrestamos(); return;
          }
          const botonGestion = evento.target.closest('[data-update-prestamo]');
          if (!botonGestion || !puedeGestionar) {
            return;
          }
          await actualizarEstadoPrestamo(
            botonGestion.getAttribute('data-update-prestamo'),
            botonGestion.getAttribute('data-prestamo-status'),
          );
          await renderCategorias();
          renderRecursosPorCategoria();
          await renderFiltrosPrestamos();
          await renderListaPrestamos();
          dibujarIconos();
        });
        
        selectCategoria.addEventListener('change', function () {
          if (selectorRecursos) {
            selectorRecursos.aplicarCategoria(selectCategoria.value);
          }
          dibujarIconos();
        });

        filtrosPrestamos.addEventListener('input', renderListaPrestamos);
        filtrosPrestamos.addEventListener('change', renderListaPrestamos);
        
        formPrestamo.addEventListener('submit', async function (evento) {
          evento.preventDefault();
          if (!puedeSolicitar) {
            return;
          }
          if (!validarFormularioCliente(formPrestamo)) {
            return;
          }
          try {
            const recursosSeleccionados = obtenerRecursosSeleccionados();
            if (!recursosSeleccionados.ok) {
              return;
            }
            await guardarNuevoPrestamo({
              recursosDetalle: recursosSeleccionados.recursos,
              cantidad: recursosSeleccionados.total,
              fecha: document.getElementById('prestamo-fecha').value,
              jornada: document.getElementById('prestamo-jornada').value,
              ubicacion: document.getElementById('prestamo-ubicacion').value,
              detalle: document.getElementById('prestamo-detalle').value,
            });
            formPrestamo.reset();
            selectorRecursos.limpiar();
            selectCategoria.value = '';
            inicializarSelectsPersonalizados(selectCategoria);
            await renderFiltrosPrestamos();
            await renderListaPrestamos();
            dibujarIconos();
          } catch (error) {
            manejarErrorCliente(error);
          }
        });
        
        await renderCategorias();
        renderRecursosPorCategoria();
        await renderLugares();
        await renderFiltrosPrestamos();
        await renderListaPrestamos();
        dibujarIconos();
      }
      })();
    </script>
  </body>
</html>
