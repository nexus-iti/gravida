<!doctype html>
<html lang="es" data-tema="claro" data-idioma="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historial de cambios | Inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css?v=traslado-equipo" />
</head>
  <body data-section="inventario" data-requires-auth="true">
    <div id="cabecera-superior"></div>
    <main>
      <div id="cabecera-de-pagina"></div>
      <div class="filter-panel filter-panel--page regla-diseno-057">
        <div id="barra-de-filtros" class="filter-bar filter-panel__body regla-diseno-057"></div>
      </div>
      <div
        id="lista-de-historial"
        class="timeline"
        style="padding:0 var(--espaciado-pagina) 24px;"
      ></div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="../js/router.js?v=5.0.0"></script>
    
    
    
    
    
    
    
    
    
    
    
    
    <script>
      
      if (protegerRuta()) {
        (async function () {
        mostrarEn(
          'cabecera-superior',
          crearCabeceraCompleta([
            { etiqueta: 'Home', enlace: 'home.html' },
            { etiqueta: 'Inventario', enlace: 'inventario.html' },
            { etiqueta: 'Historial de cambios' },
          ]),
        );
        mostrarEn('cabecera-de-pagina', crearCabeceraDePagina({ titulo: 'Historial de cambios' }));
        
        const historial = await obtenerHistorialInventario();
        const filtrosHtml =
          crearCajaDeBusqueda('Buscar en historial...', 'input-buscar-historial') +
          crearCampoFiltroSelect(
            'filtro-historial-autor',
            'Autor',
            crearOpcionesAutoresHistorial(historial),
          ) +
          crearCampoFiltroFecha('filtro-historial-fecha', 'Fecha', 'data-clave="fecha"') +
          crearCampoFiltroSelect(
            'filtro-historial-tipo',
            'Tipo de cambio',
            crearOpcionesFiltro(obtenerValoresUnicosFiltro(historial, 'etiqueta'), 'Todos'),
          );
        mostrarEn('barra-de-filtros', filtrosHtml);
        
        function obtenerFiltrosHistorial() {
          return [
            {
              campos: ['titulo', 'etiqueta', 'descripcion', 'autor'],
              valor: obtenerValorCampoFormulario('input-buscar-historial'),
            },
            { campo: 'autorId', valor: obtenerValorCampoFormulario('filtro-historial-autor'), comparacion: 'igual' },
            { campo: 'fecha', valor: obtenerValorCampoFormulario('filtro-historial-fecha'), tipo: 'fecha' },
            { campo: 'etiqueta', valor: obtenerValorCampoFormulario('filtro-historial-tipo'), comparacion: 'igual' },
          ];
        }

        function crearOpcionesAutoresHistorial(registros) {
          const autores = new Map();
          for (let i = 0; i < registros.length; i++) {
            autores.set(String(registros[i].autorId || 'sistema'), String(registros[i].autor || 'Sistema'));
          }
          let opciones = '<option value="">Todos</option>';
          Array.from(autores.entries())
            .sort(function (a, b) { return a[1].localeCompare(b[1], 'es'); })
            .forEach(function (autor) {
              opciones += '<option value="' + escaparHtml(autor[0]) + '">' + escaparHtml(autor[1]) + '</option>';
            });
          return opciones;
        }

        function renderHistorial() {
          const historialFiltrado = filtrarRegistrosPorCampos(historial, obtenerFiltrosHistorial());
          let listaHtml = '';
          if (historialFiltrado.length === 0) {
            listaHtml = crearEstadoVacio({
              icono: 'history',
              titulo: 'Todavía no hay cambios registrados',
              descripcion: 'Las altas y bajas de secciones o equipos van a aparecer acá.',
            });
          } else {
            for (let i = 0; i < historialFiltrado.length; i++) {
              listaHtml += crearTarjetaDeHistorial(historialFiltrado[i]);
            }
          }
          mostrarEn('lista-de-historial', listaHtml);
          dibujarIconos();
        }

        document.getElementById('barra-de-filtros').addEventListener('input', renderHistorial);
        document.getElementById('barra-de-filtros').addEventListener('change', renderHistorial);
        renderHistorial();
        })();
      }
    </script>
  </body>
</html>
